version: 2
updates:
  # Next.js dashboard
  - package-ecosystem: npm
    directory: /insightistic-app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      next:
        patterns: ["next", "react", "react-dom", "react-is", "@types/react*"]
      dev-tooling:
        dependency-type: development

  # Laravel API
  - package-ecosystem: composer
    directory: /insightistic-api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      laravel:
        patterns: ["laravel/*", "illuminate/*"]

  # Docker base images
  - package-ecosystem: docker
    directory: /docker/api
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker/app
    schedule:
      interval: weekly

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
