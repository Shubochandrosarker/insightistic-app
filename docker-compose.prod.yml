name: ${COMPOSE_PROJECT_NAME:-insightistic}

x-watchtower-labels: &watchtower-labels
  com.centurylinklabs.watchtower.enable: "true"
  com.centurylinklabs.watchtower.scope: ${WATCHTOWER_SCOPE:-insightistic}

x-api-image: &api-image
  image: ${IMAGE_NAMESPACE:-ghcr.io/shubochandrosarker/insightistic-app}/api:${IMAGE_TAG:-latest}
  pull_policy: always

x-api-environment: &api-environment
  APP_NAME: ${APP_NAME:-Insightistic}
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?set APP_KEY in .env.production}
  APP_URL: ${APP_URL:-https://api.insightistic.com}
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  INSIGHTISTIC_APP_URL: ${INSIGHTISTIC_APP_URL:-https://app.insightistic.com}
  INSIGHTISTIC_TRIAL_DAYS: ${INSIGHTISTIC_TRIAL_DAYS:-7}
  INSIGHTISTIC_RELEASE: ${INSIGHTISTIC_RELEASE:-unknown}
  INSIGHTISTIC_BUILD_TIME: ${INSIGHTISTIC_BUILD_TIME:-}
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-insightistic}
  DB_USERNAME: ${DB_USERNAME:-insightistic}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
  CACHE_STORE: ${CACHE_STORE:-redis}
  SESSION_DRIVER: database
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  SESSION_DOMAIN: ${SESSION_DOMAIN:-.insightistic.com}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-app.insightistic.com}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.insightistic.com}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-reports@insightistic.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Insightistic}
  STRIPE_SECRET: ${STRIPE_SECRET:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  BILLING_PROVIDER: ${BILLING_PROVIDER:?set BILLING_PROVIDER in .env.production}
  PADDLE_ENV: ${PADDLE_ENV:-production}
  PADDLE_API_KEY: ${PADDLE_API_KEY:-}
  PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
  PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
  FEATURE_PADDLE: ${FEATURE_PADDLE:?set FEATURE_PADDLE in .env.production}
  GOOGLE_ADS_CONVERSIONS_ENABLED: ${GOOGLE_ADS_CONVERSIONS_ENABLED:-false}
  GOOGLE_ADS_CONVERSIONS_ENDPOINT: ${GOOGLE_ADS_CONVERSIONS_ENDPOINT:-https://googleads.googleapis.com}
  GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
  GOOGLE_ADS_ACCESS_TOKEN: ${GOOGLE_ADS_ACCESS_TOKEN:-}
  GOOGLE_ADS_CUSTOMER_ID: ${GOOGLE_ADS_CUSTOMER_ID:-}
  GOOGLE_ADS_CONVERSION_ACTION_ID: ${GOOGLE_ADS_CONVERSION_ACTION_ID:-}
  GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
  META_CONVERSIONS_ENABLED: ${META_CONVERSIONS_ENABLED:-false}
  META_CONVERSIONS_ENDPOINT: ${META_CONVERSIONS_ENDPOINT:-https://graph.facebook.com/v20.0}
  META_PIXEL_ID: ${META_PIXEL_ID:-}
  META_CONVERSIONS_ACCESS_TOKEN: ${META_CONVERSIONS_ACCESS_TOKEN:-}
  PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
  PAGESPEED_TIMEOUT: ${PAGESPEED_TIMEOUT:-90}
  PAGESPEED_MAX_PER_MINUTE: ${PAGESPEED_MAX_PER_MINUTE:-20}
  PAGESPEED_MAX_PER_SITE_PER_DAY: ${PAGESPEED_MAX_PER_SITE_PER_DAY:-8}
  SEED_BILLING_CATALOG: ${SEED_BILLING_CATALOG:-false}
  INSIGHTISTIC_AI_PROVIDER: ${INSIGHTISTIC_AI_PROVIDER:-plan_aware}
  INSIGHTISTIC_AI_TIMEOUT: ${INSIGHTISTIC_AI_TIMEOUT:-240}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-180}
  OPENROUTER_FREE_MODEL: ${OPENROUTER_FREE_MODEL:-openrouter/free}
  OPENROUTER_PAID_MODEL: ${OPENROUTER_PAID_MODEL:-openai/gpt-6-luna}
  OPENROUTER_PAID_FALLBACK_MODELS: ${OPENROUTER_PAID_FALLBACK_MODELS:-z-ai/glm-5.3-flash}
  WPISTIC_GATEWAY_URL: ${WPISTIC_GATEWAY_URL:-https://ai.wpistic.com}
  WPISTIC_GATEWAY_PRODUCT_KEY: ${WPISTIC_GATEWAY_PRODUCT_KEY:-}
  WPISTIC_GATEWAY_PRODUCT_ID: ${WPISTIC_GATEWAY_PRODUCT_ID:-insightistic}
  WPISTIC_GATEWAY_MODEL: ${WPISTIC_GATEWAY_MODEL:-glm-5.3}
  WPISTIC_GATEWAY_MAX_TOKENS: ${WPISTIC_GATEWAY_MAX_TOKENS:-1200}
  WPISTIC_GATEWAY_TIMEOUT: ${WPISTIC_GATEWAY_TIMEOUT:-30}
  INSIGHTISTIC_EMBEDDINGS_PROVIDER: ${INSIGHTISTIC_EMBEDDINGS_PROVIDER:-none}
  INSIGHTISTIC_EMBEDDINGS_MODEL: ${INSIGHTISTIC_EMBEDDINGS_MODEL:-text-embedding-3-small}
  INSIGHTISTIC_EMBEDDINGS_API_KEY: ${INSIGHTISTIC_EMBEDDINGS_API_KEY:-}
  INSIGHTISTIC_EMBEDDINGS_BASE_URL: ${INSIGHTISTIC_EMBEDDINGS_BASE_URL:-https://api.openai.com/v1}
  INSIGHTISTIC_KNOWLEDGE_DISK: ${INSIGHTISTIC_KNOWLEDGE_DISK:-local}
  SANCTUM_EXPIRATION_MINUTES: ${SANCTUM_EXPIRATION_MINUTES:-720}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
  MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
  MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
  MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
  MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
  OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-https://app.insightistic.com}
  INSIGHTISTIC_REPORTS_DISK: ${INSIGHTISTIC_REPORTS_DISK:-public}
  INSIGHTISTIC_LICENSE_VALIDATE_INTERVAL: ${INSIGHTISTIC_LICENSE_VALIDATE_INTERVAL:-86400}
  INSIGHTISTIC_LICENSE_GRACE_HOURS: ${INSIGHTISTIC_LICENSE_GRACE_HOURS:-72}
  INSIGHTISTIC_PAYMENT_GRACE_DAYS: ${INSIGHTISTIC_PAYMENT_GRACE_DAYS:-7}
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
  SEED_PLANS: ${SEED_PLANS:-false}

services:
  db:
    # pgvector/pgvector ships PostgreSQL + the vector extension the AI
    # knowledge base uses. Drop-in compatible with the postgres image.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-insightistic}
      POSTGRES_USER: ${DB_USERNAME:-insightistic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-insightistic} -d ${DB_DATABASE:-insightistic}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    networks:
      - internal
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot migration runner for deploy windows:
  #   docker compose --profile ops run --rm migrate
  migrate:
    <<: *api-image
    profiles: ["ops"]
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *api-environment
    networks:
      - internal

  api:
    <<: *api-image
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-environment
    volumes:
      - api-storage:/var/www/html/storage/app
    networks:
      - internal
    labels:
      <<: *watchtower-labels
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  queue:
    <<: *api-image
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--backoff=10,60,300", "--max-time=3600", "--timeout=600"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: "false"
      SEED_PLANS: "false"
    volumes:
      - api-storage:/var/www/html/storage/app
    networks:
      - internal
    labels:
      <<: *watchtower-labels

  scheduler:
    <<: *api-image
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *api-environment
      RUN_MIGRATIONS: "false"
      SEED_PLANS: "false"
    volumes:
      - api-storage:/var/www/html/storage/app
    networks:
      - internal
    labels:
      <<: *watchtower-labels

  app:
    image: ${IMAGE_NAMESPACE:-ghcr.io/shubochandrosarker/insightistic-app}/app:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    networks:
      - internal
    labels:
      <<: *watchtower-labels
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - internal
      - traefik
    labels:
      <<: *watchtower-labels
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.insightistic-app.rule: Host(`${APP_HOST:-app.insightistic.com}`)
      traefik.http.routers.insightistic-app.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.insightistic-app.tls: "true"
      traefik.http.routers.insightistic-app.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.insightistic-app.service: insightistic-nginx
      traefik.http.routers.insightistic-api.rule: Host(`${API_HOST:-api.insightistic.com}`)
      traefik.http.routers.insightistic-api.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.insightistic-api.tls: "true"
      traefik.http.routers.insightistic-api.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.insightistic-api.service: insightistic-nginx
      traefik.http.services.insightistic-nginx.loadbalancer.server.port: "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  api-storage:

networks:
  internal:
    driver: bridge
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
