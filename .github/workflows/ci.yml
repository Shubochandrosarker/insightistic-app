name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend (typecheck, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insightistic-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: insightistic-app/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      # Component tests run before the build: a failing assertion is far
      # cheaper to read than a broken bundle, and catches the render-level
      # regressions (null vs 0, MFA step, error states) a build cannot.
      - name: Component tests (vitest)
        run: npm test
      - name: Production build
        run: npm run build
      # Fail on high/critical vulnerabilities in production dependencies.
      # Dev-only findings are reported but do not block.
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit (full, informational)
        run: npm audit || true

  backend:
    name: Backend (Pest on PostgreSQL + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insightistic-api
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_DATABASE: insightistic_test
      DB_USERNAME: insightistic
      DB_PASSWORD: insightistic
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: insightistic_test
          POSTGRES_USER: insightistic
          POSTGRES_PASSWORD: insightistic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U insightistic"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, gd, intl, zip, bcmath, redis
          coverage: none
      - name: Validate composer files
        run: composer validate --no-check-publish
      - name: Install (locked)
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Migration test — empty database up/rollback/up
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force
          php artisan db:seed --class=Database\\Seeders\\PlanSeeder --force
      # Migrating an *already-populated* schema is the case that actually
      # happens on deploy. Running only the empty-database path would miss a
      # migration that works on a fresh install but fails against real rows.
      - name: Migration test — populated database
        run: |
          php artisan db:seed --class=Database\\Seeders\\PlanSeeder --force
          php artisan migrate --force
          php artisan migrate:status
      # Safe WooCommerce Query Engine (P1): provisions the least-privilege
      # Postgres role tests/Feature/Query/ReadOnlyIdentityTest.php connects
      # as directly, proving at the database level (not just app logic) that
      # it cannot write. Credentials match phpunit.xml's READONLY_DB_* values.
      # Belt-and-suspenders: tests/Pest.php also self-provisions this same
      # role once Pest's RefreshDatabase has finished migrate:fresh (which
      # drops/recreates every table and would otherwise wipe this step's
      # grants) — see that file's docblock. This step keeps provisioning
      # visible in the CI log and is not itself load-bearing.
      - name: Provision read-only query-engine role
        run: php artisan db:provision-readonly-role --role=insightistic_readonly --password=readonly_test_pw
      - name: Pest test suite
        run: php artisan test --compact
      # Informational only. The codebase deliberately aligns `=>` in arrays
      # and uses a brace style Pint's default Laravel preset rewrites, so a
      # blocking check today would fail on ~180 pre-existing files. Making it
      # gate would mean a mass reformat — a huge, unreviewable diff that
      # belongs in its own change, not bundled with a test-infrastructure PR.
      # Adopt a pint.json matching house style, then flip this to blocking.
      - name: Coding standards (Pint, informational)
        run: ./vendor/bin/pint --test || true

  plugin:
    name: WordPress plugin checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1" # plugin supports PHP >= 8.0; lint on the floor-adjacent version
          coverage: none
      - name: PHP syntax check (all plugin files)
        run: |
          set -e
          find insightistic -name '*.php' -print0 | while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null
          done
          echo "All plugin files lint clean."
      - name: ABSPATH guard check
        run: |
          missing=0
          for f in $(find insightistic/includes insightistic -maxdepth 1 -name '*.php'); do
            grep -q "ABSPATH\|WP_UNINSTALL_PLUGIN" "$f" || { echo "Missing ABSPATH guard: $f"; missing=1; }
          done
          exit $missing
      - name: WordPress Coding Standards (informational)
        continue-on-error: true
        run: |
          composer global require --no-interaction --quiet \
            wp-coding-standards/wpcs:"^3.0" dealerdirect/phpcodesniffer-composer-installer:"^1.0"
          "$(composer global config bin-dir --absolute --quiet)/phpcs" \
            --standard=WordPress-Extra --extensions=php --severity=5 insightistic || true

  docker:
    name: Docker builds (no push)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api/Dockerfile
          push: false
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,mode=max,scope=ci-api
      - name: Build App image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app/Dockerfile
          push: false
          cache-from: type=gha,scope=ci-app
          cache-to: type=gha,mode=max,scope=ci-app

  secrets-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Flags known-vulnerable dependencies introduced by a pull request, across
  # npm and composer. Separate from the npm audit in the frontend job: that
  # only sees the JS tree, and only after a lockfile change lands.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Advisories with no fix available would otherwise block every PR
          # until upstream ships one, which is not something a PR author can act on.
          warn-only: false
          comment-summary-in-pr: always
