# Insightistic production stack (Hostinger VPS).
#   cp .env.docker.example .env   # fill in values
#   docker compose -f docker-compose.hostinger.yml up -d --build
#
# Services:
#   db        Postgres 16 (persistent volume)
#   api       Laravel API (migrations + plan seeding on boot)
#   queue     queue:work  — lifecycle emails, snapshot jobs
#   scheduler schedule:work — nightly snapshots + hourly trial automation
#   app       Next.js dashboard (proxy mode: forwards /api/* to the api service)
#   nginx     routes api.insightistic.com → api, everything else → app

services:
  db:
    # pgvector/pgvector ships PostgreSQL 16 plus the `vector` extension the AI
    # knowledge base needs. On plain postgres:16-alpine the schema still
    # migrates, but retrieval silently degrades to full-text search only.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-insightistic}
      POSTGRES_USER: ${DB_USERNAME:-insightistic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-insightistic} -d ${DB_DATABASE:-insightistic}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api: &api
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &api-env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?set APP_KEY in .env}
      APP_URL: ${APP_URL:-https://api.insightistic.com}
      INSIGHTISTIC_APP_URL: ${INSIGHTISTIC_APP_URL:-https://app.insightistic.com}
      INSIGHTISTIC_TRIAL_DAYS: ${INSIGHTISTIC_TRIAL_DAYS:-7}
      INSIGHTISTIC_RELEASE: ${INSIGHTISTIC_RELEASE:-unknown}
      INSIGHTISTIC_BUILD_TIME: ${INSIGHTISTIC_BUILD_TIME:-}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-insightistic}
      DB_USERNAME: ${DB_USERNAME:-insightistic}
      DB_PASSWORD: ${DB_PASSWORD}
      READONLY_DB_USERNAME: ${READONLY_DB_USERNAME:-}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:-}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-reports@insightistic.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Insightistic}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-stripe}
      PADDLE_ENV: ${PADDLE_ENV:-production}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_PRICE_ANGEL_SOLO: ${PADDLE_PRICE_ANGEL_SOLO:-}
      PADDLE_PRICE_ANGEL_STUDIO: ${PADDLE_PRICE_ANGEL_STUDIO:-}
      PADDLE_PRICE_ANGEL_AGENCY: ${PADDLE_PRICE_ANGEL_AGENCY:-}
      FEATURE_PADDLE: ${FEATURE_PADDLE:-false}
      SEED_BILLING_CATALOG: ${SEED_BILLING_CATALOG:-false}
      INSIGHTISTIC_AI_PROVIDER: ${INSIGHTISTIC_AI_PROVIDER:-plan_aware}
      INSIGHTISTIC_AI_MODEL: ${INSIGHTISTIC_AI_MODEL:-gpt-4o-mini}
      INSIGHTISTIC_AI_TIMEOUT: ${INSIGHTISTIC_AI_TIMEOUT:-240}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-180}
      OPENROUTER_FREE_MODEL: ${OPENROUTER_FREE_MODEL:-openrouter/free}
      OPENROUTER_FREE_FALLBACK_MODELS: ${OPENROUTER_FREE_FALLBACK_MODELS:-nvidia/nemotron-3-super-120b-a12b:free,liquid/lfm-2.5-2.6b:free}
      OPENROUTER_PAID_MODEL: ${OPENROUTER_PAID_MODEL:-openai/gpt-6-luna}
      OPENROUTER_PAID_FALLBACK_MODELS: ${OPENROUTER_PAID_FALLBACK_MODELS:-z-ai/glm-5.3-flash}
      WPISTIC_GATEWAY_URL: ${WPISTIC_GATEWAY_URL:-https://ai.wpistic.com}
      WPISTIC_GATEWAY_CHAT_PATH: ${WPISTIC_GATEWAY_CHAT_PATH:-/compat/chat/completions}
      WPISTIC_GATEWAY_PRODUCT_KEY: ${WPISTIC_GATEWAY_PRODUCT_KEY:-}
      WPISTIC_GATEWAY_PRODUCT_ID: ${WPISTIC_GATEWAY_PRODUCT_ID:-insightistic}
      WPISTIC_GATEWAY_MODEL: ${WPISTIC_GATEWAY_MODEL:-glm-5.3}
      WPISTIC_GATEWAY_MAX_TOKENS: ${WPISTIC_GATEWAY_MAX_TOKENS:-1200}
      WPISTIC_GATEWAY_TIMEOUT: ${WPISTIC_GATEWAY_TIMEOUT:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      INTEGRATIONS_GOOGLE_REDIRECT_URI: ${INTEGRATIONS_GOOGLE_REDIRECT_URI:-https://api.insightistic.com/api/integrations/google/callback}
      APPSUMO_LICENSING_BASE_URL: ${APPSUMO_LICENSING_BASE_URL:-https://api.licensing.appsumo.com/v2}
      APPSUMO_LICENSING_API_KEY: ${APPSUMO_LICENSING_API_KEY:-}
      APPSUMO_LICENSING_WEBHOOK_SECRET: ${APPSUMO_LICENSING_WEBHOOK_SECRET:-}
      APPSUMO_OAUTH_CLIENT_ID: ${APPSUMO_OAUTH_CLIENT_ID:-}
      APPSUMO_OAUTH_CLIENT_SECRET: ${APPSUMO_OAUTH_CLIENT_SECRET:-}
      APPSUMO_OAUTH_REDIRECT_URI: ${APPSUMO_OAUTH_REDIRECT_URI:-https://api.insightistic.com/api/appsumo/oauth/callback}
      APPSUMO_OAUTH_TOKEN_URL: ${APPSUMO_OAUTH_TOKEN_URL:-https://appsumo.com/openid/token/}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SEED_PLANS: ${SEED_PLANS:-true}
    volumes:
      - api-storage:/var/www/html/storage/app

  queue:
    <<: *api
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "false"
      SEED_PLANS: "false"
    depends_on:
      api:
        condition: service_started

  scheduler:
    <<: *api
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "false"
      SEED_PLANS: "false"
    depends_on:
      api:
        condition: service_started

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        # Empty = proxy mode: the browser calls same-origin /api and Next.js
        # forwards to the api container. No CORS, no mixed content.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    depends_on:
      api:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - app

volumes:
  pgdata:
  api-storage:
