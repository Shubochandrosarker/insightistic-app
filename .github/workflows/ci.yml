name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend (typecheck, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insightistic-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: insightistic-app/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      # Fail on high/critical vulnerabilities in production dependencies.
      # Dev-only findings are reported but do not block.
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit (full, informational)
        run: npm audit || true

  backend:
    name: Backend (Pest on PostgreSQL + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insightistic-api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: insightistic_test
          POSTGRES_USER: insightistic
          POSTGRES_PASSWORD: insightistic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U insightistic"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, gd, intl, zip, bcmath, redis
          coverage: none
      - name: Validate composer files
        run: composer validate --no-check-publish
      - name: Install (locked)
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Migration test — empty database up/rollback/up
        env: &db-env
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: insightistic_test
          DB_USERNAME: insightistic
          DB_PASSWORD: insightistic
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force
          php artisan db:seed --class=Database\\Seeders\\PlanSeeder --force
      - name: Pest test suite
        env: *db-env
        run: php artisan test --compact

  plugin:
    name: WordPress plugin checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1" # plugin supports PHP >= 8.0; lint on the floor-adjacent version
          coverage: none
      - name: PHP syntax check (all plugin files)
        run: |
          set -e
          find insightistic -name '*.php' -print0 | while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null
          done
          echo "All plugin files lint clean."
      - name: ABSPATH guard check
        run: |
          missing=0
          for f in $(find insightistic/includes insightistic -maxdepth 1 -name '*.php'); do
            grep -q "ABSPATH\|WP_UNINSTALL_PLUGIN" "$f" || { echo "Missing ABSPATH guard: $f"; missing=1; }
          done
          exit $missing
      - name: WordPress Coding Standards (informational)
        continue-on-error: true
        run: |
          composer global require --no-interaction --quiet \
            wp-coding-standards/wpcs:"^3.0" dealerdirect/phpcodesniffer-composer-installer:"^1.0"
          "$(composer global config bin-dir --absolute --quiet)/phpcs" \
            --standard=WordPress-Extra --extensions=php --severity=5 insightistic || true

  docker:
    name: Docker builds (no push)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          push: false
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,mode=max,scope=ci-api
      - name: Build App image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          push: false
          cache-from: type=gha,scope=ci-app
          cache-to: type=gha,mode=max,scope=ci-app

  secrets-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
