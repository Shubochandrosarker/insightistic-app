# Insightistic production stack (Hostinger VPS).
#   cp .env.docker.example .env   # fill in values
#   docker compose -f docker-compose.hostinger.yml up -d --build
#
# Services:
#   db        Postgres 16 (persistent volume)
#   api       Laravel API (migrations + plan seeding on boot)
#   queue     queue:work  — lifecycle emails, snapshot jobs
#   scheduler schedule:work — nightly snapshots + hourly trial automation
#   app       Next.js dashboard (proxy mode: forwards /api/* to the api service)
#   nginx     routes api.insightistic.com → api, everything else → app

services:
  db:
    # pgvector/pgvector ships PostgreSQL 16 plus the `vector` extension the AI
    # knowledge base needs. On plain postgres:16-alpine the schema still
    # migrates, but retrieval silently degrades to full-text search only.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-insightistic}
      POSTGRES_USER: ${DB_USERNAME:-insightistic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-insightistic} -d ${DB_DATABASE:-insightistic}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api: &api
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &api-env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?set APP_KEY in .env}
      APP_URL: ${APP_URL:-https://api.insightistic.com}
      INSIGHTISTIC_APP_URL: ${INSIGHTISTIC_APP_URL:-https://app.insightistic.com}
      INSIGHTISTIC_TRIAL_DAYS: ${INSIGHTISTIC_TRIAL_DAYS:-7}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-insightistic}
      DB_USERNAME: ${DB_USERNAME:-insightistic}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-reports@insightistic.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Insightistic}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      INSIGHTISTIC_AI_PROVIDER: ${INSIGHTISTIC_AI_PROVIDER:-openai}
      INSIGHTISTIC_AI_MODEL: ${INSIGHTISTIC_AI_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SEED_PLANS: ${SEED_PLANS:-true}
    volumes:
      - api-storage:/var/www/html/storage/app

  queue:
    <<: *api
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "false"
      SEED_PLANS: "false"
    depends_on:
      api:
        condition: service_started

  scheduler:
    <<: *api
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "false"
      SEED_PLANS: "false"
    depends_on:
      api:
        condition: service_started

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        # Empty = proxy mode: the browser calls same-origin /api and Next.js
        # forwards to the api container. No CORS, no mixed content.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8000}
    depends_on:
      api:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - app

volumes:
  pgdata:
  api-storage:
