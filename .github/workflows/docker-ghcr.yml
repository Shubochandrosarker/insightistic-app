name: Build and Publish Docker Images to GHCR

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-ghcr.yml"
      - "docker/**"
      - "insightistic-app/**"
      - "insightistic-api/**"
      - "docker-compose.prod.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: insightistic-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Mirrors docker/api/Dockerfile's build steps against a real Postgres
    # service so a migration that doesn't apply cleanly fails CI here,
    # instead of being executed for the first time by entrypoint.sh in
    # production.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: insightistic_test
          POSTGRES_USER: insightistic
          POSTGRES_PASSWORD: insightistic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insightistic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, zip, bcmath, gd
          coverage: none

      - name: Build a throwaway Laravel skeleton (same steps as docker/api/Dockerfile)
        run: |
          composer create-project laravel/laravel /tmp/insightistic-api-ci "12.*" --no-interaction --prefer-dist
          cd /tmp/insightistic-api-ci
          composer require laravel/sanctum barryvdh/laravel-dompdf stripe/stripe-php \
            laravel/socialite socialiteproviders/microsoft --no-interaction --no-scripts
          php artisan package:discover --ansi

      - name: Overlay insightistic-api/ and run migrations
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: insightistic_test
          DB_USERNAME: insightistic
          DB_PASSWORD: insightistic
        run: |
          cp -a insightistic-api/. /tmp/insightistic-api-ci/
          cd /tmp/insightistic-api-ci
          php artisan key:generate --force --no-interaction
          php artisan migrate --force --no-interaction
          php artisan db:seed --class=Database\\Seeders\\PlanSeeder --force --no-interaction

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image namespace
        id: images
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          echo "namespace=ghcr.io/${owner}/${repo}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/app/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=
            API_PROXY_TARGET=http://api:8000
          tags: |
            ${{ steps.images.outputs.namespace }}/app:latest
            ${{ steps.images.outputs.namespace }}/app:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Insightistic Frontend
          cache-from: type=gha,scope=insightistic-app
          cache-to: type=gha,mode=max,scope=insightistic-app

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.images.outputs.namespace }}/api:latest
            ${{ steps.images.outputs.namespace }}/api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Insightistic API
          cache-from: type=gha,scope=insightistic-api
          cache-to: type=gha,mode=max,scope=insightistic-api
